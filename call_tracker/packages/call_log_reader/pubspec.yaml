name: call_log_reader
description: Reads the Android call log and places calls for Call Tracker.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.fiinny.calllogreader
        pluginClass: CallLogReaderPlugin
