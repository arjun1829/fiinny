name: krishidukaan_sales
description: KrishiDukaan Sales — field team app
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0

  # Firebase
  # firebase_core is pinned, not caret-ranged: 4.12+ pulls firebase_core_web
  # 3.11.0, whose `e.isA<JSObject>()` on a catch-clause `Object` fails to
  # compile for web on the current Dart SDK. 4.11.0 resolves firebase_core_web
  # 3.9.0, which is clean — and is what mobile/ already ships.
  firebase_core: 4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  # Location & maps
  geolocator: ^14.0.3
  google_maps_flutter: ^2.13.1

  # Networking
  http: ^1.2.2

  # UI utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  package_info_plus: ^10.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
