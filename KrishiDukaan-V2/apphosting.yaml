runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2

env:
  # ─── Firebase Client SDK (injected at build time via NEXT_PUBLIC_*) ──────────
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: krishidukan-e8315

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDh_Y67TDJc2KLLJ8Wcc2JvEeHzmfVL778

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: krishidukan.com

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: krishidukan-e8315.firebasestorage.app

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "650303885415"

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:650303885415:web:7db7619260aa478b2b84c2

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-7MEFGCD4EX

  - variable: NEXT_PUBLIC_BASE_URL
    value: https://krishidukan.com

  - variable: NEXT_PUBLIC_RAZORPAY_KEY_ID
    value: rzp_live_S1aAwIHZXLMSDG

  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: AIzaSyDh_Y67TDJc2KLLJ8Wcc2JvEeHzmfVL778

  # ─── Email (SMTP) ──────────────────────────────────────────────────────────
  # Store sensitive values in Secret Manager:
  #   firebase apphosting:secrets:set SMTP_PASS
  #   firebase apphosting:secrets:set SMTP_USER
  # Then reference them here as secret: SMTP_PASS (not value:)
  - variable: SMTP_HOST
    value: smtp.gmail.com

  - variable: SMTP_PORT
    value: "587"

  - variable: SMTP_SECURE
    value: "false"

  - variable: SMTP_USER
    secret: SMTP_USER

  - variable: SMTP_PASS
    secret: SMTP_PASS

  - variable: SMTP_FROM
    value: "KrishiDukan <vinay.sharma@fiinny.com>"

  # ─── Razorpay (server-side) ────────────────────────────────────────────────
  - variable: RAZORPAY_KEY_ID
    value: rzp_live_S1aAwIHZXLMSDG

  - variable: RAZORPAY_KEY_SECRET
    secret: RAZORPAY_KEY_SECRET

  # ─── Cron ──────────────────────────────────────────────────────────────────
  - variable: CRON_SECRET
    value: krishidukan-cron-2026

  - variable: NEXT_PUBLIC_CRON_SECRET
    value: krishidukan-cron-2026

  # ─── Firebase Admin SDK ────────────────────────────────────────────────────
  - variable: FIREBASE_PROJECT_ID
    value: krishidukan-e8315

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
