flutter_native_splash:
  # Plain green native splash — NO logo. Android paints this only while the
  # process boots (before Flutter draws). Keeping it a bare green that matches
  # AppColors.primary makes it blend seamlessly into our animated SplashScreen,
  # so the user only ever perceives our custom animated landing page.
  color: "#2E7D32"
  color_dark: "#1B5E20"

  android_12:
    color: "#2E7D32"
    color_dark: "#1B5E20"
    icon_background_color: "#2E7D32"

  web: false
  ios: false
