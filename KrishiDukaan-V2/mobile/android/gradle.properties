# Sized to fit this machine's ~7 GB physical RAM. -Xmx8G previously caused a
# native OutOfMemory JVM crash (the daemon "disappeared") during R8/bundleRelease.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Cap the Kotlin compile daemon (separate JVM) so Gradle + Kotlin + Dart all fit.
kotlin.daemon.jvmargs=-Xmx1g
# Limit parallel worker JVMs to keep peak memory down on a low-RAM machine.
org.gradle.workers.max=2
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
