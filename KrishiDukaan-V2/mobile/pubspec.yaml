name: krishidukaan_app
description: KrishiDukaan — Agri Commerce Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.2.3
  flutter_local_notifications: ^22.0.0

  # Localizations
  flutter_localizations:
    sdk: flutter

  # Payments
  razorpay_flutter: ^1.3.6

  # Location & Maps
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Networking
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.4.25

  # UI utilities
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
