name: krishidukaan_app
description: KrishiDukaan — Agri Commerce Platform
publish_to: 'none'
version: 2.4.0+116

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  firebase_messaging: ^16.4.0
  firebase_crashlytics: ^5.2.4
  flutter_local_notifications: ^22.0.1

  # Localizations
  flutter_localizations:
    sdk: flutter

  # Payments
  razorpay_flutter: ^1.3.6

  # Location & Maps
  geolocator: ^14.0.3
  google_maps_flutter: ^2.13.1

  # Networking
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.4.25

  # UI utilities
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  package_info_plus: ^10.1.0

  # AgriReels
  video_player: ^2.9.1
  share_plus: ^13.1.0
  video_compress: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/

  # Bundled so 'Roboto' (AppTextStyles._fontFamily) resolves identically on
  # both platforms. Android has Roboto built into the OS so it "just worked"
  # there; iOS has no system Roboto, so unbundled it silently fell back to San
  # Francisco — whose different line-height metrics broke the tuned spacing
  # under headings like "Trending Near You" / "Shop by Category".
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
